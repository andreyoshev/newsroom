{% extends "base.html" %}
{% block title %}Sign up — {{ site_name }}{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1>Create account</h1>
  {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
  <form method="post" action="/signup">
    <label>Email
      <input type="email" name="email" required autofocus autocomplete="username">
    </label>
    <label>Password <span class="muted">(min 8 characters)</span>
      <input type="password" name="password" required minlength="8" autocomplete="new-password">
    </label>
    {% if invite_required %}
    <label>Invite code
      <input type="text" name="invite" required placeholder="code from the service owner">
    </label>
    {% endif %}
    <button class="btn primary" type="submit">Create account</button>
  </form>
  <p class="muted small">Already have an account? <a href="/login">Sign in</a></p>
</div>
{% endblock %}
